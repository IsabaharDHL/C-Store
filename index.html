<style>

.btn.line{background:transparent;color:var(--txt);border:1.5px solid var(--line)}

.mini{background:transparent;border:1.5px solid var(--line);color:var(--txt);border-radius:9px;padding:6px 10px;font-size:.8rem}

.chk{display:flex;align-items:center;gap:10px;font-weight:500}
.sec-tag{display:inline-block;font-size:.72rem;font-weight:700;border-radius:999px;padding:2px 9px;background:rgba(201,162,39,.18);color:var(--gold);margin-inline-start:6px;vertical-align:middle}
.sec-sw{margin:0 0 12px}
.sec-sw select{font-weight:700}
.sec-row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid rgba(127,127,127,.18)}
.chk input{width:22px;height:22px}
details summary{font-weight:700;cursor:pointer}
.bcimg{display:block;width:100%;max-width:420px;margin:16px auto 0;border-radius:8px;background:#fff}

.flow{position:fixed;inset:0;z-index:50;background:var(--navy);display:flex;flex-direction:column;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.flow .fh{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:4px solid var(--green)}
.flow.del .fh{border-bottom-color:var(--orange)}

.flow .ft{font-size:1.15rem;font-weight:700;flex:1}
.flow .steps{color:var(--mut);font-size:.85rem}
.flow .fb{flex:1;overflow-y:auto;padding:18px;max-width:560px;width:100%;margin:0 auto}
.prompt{font-size:1.3rem;font-weight:700;text-align:center;margin:2px 0 8px}
.reader{width:100%;height:170px;min-height:170px;max-height:170px;border-radius:14px;overflow:hidden;background:#000}
.reader video{width:100%!important;height:170px!important;object-fit:cover;border-radius:14px}
.scanmsg{display:none;margin-top:12px;background:rgba(226,85,85,.18);border:1px solid rgba(226,85,85,.6);color:#ffc2c2;border-radius:12px;padding:12px;text-align:center;font-weight:500}
.scanmsg.show{display:block}
.flash-btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;margin-top:7px;border:1.5px solid var(--gold);background:transparent;color:var(--gold);border-radius:12px;padding:11px;font:inherit;font-weight:700}
.flash-btn.on{background:var(--gold);color:#1b1300}
.flash-btn:disabled{opacity:.45}
.ctx{background:var(--navy2);border:1px solid var(--line);border-radius:12px;padding:10px 14px;font-weight:700;direction:rtl}
.rc-tag{display:flex;align-items:center;justify-content:center;gap:10px;margin:0 0 10px;background:rgba(31,157,88,.16);border:1.5px solid var(--green);border-radius:12px;padding:9px 14px;animation:fadeUp .35s ease both}
.rc-tag span{color:#bfe9cf;font-size:.95rem}
.rc-tag b{font-size:1.35rem;letter-spacing:.5px;direction:ltr;unicode-bidi:isolate}
.hit-big{position:absolute;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:#fff;text-align:center;border-radius:14px;background:rgba(24,120,68,.95);animation:fadeUp .25s ease both}
.hit-big .hl{font-size:1rem;opacity:.9}
.hit-big .hn{font-size:2.4rem;font-weight:700;direction:ltr;unicode-bidi:isolate;animation:pop .45s cubic-bezier(.2,.8,.2,1) both}
[hidden]{display:none!important}
.man-btn{display:block;width:100%;margin-top:7px;border:1.5px solid var(--line);background:transparent;color:var(--txt);border-radius:12px;padding:11px;font:inherit;font-weight:700}
.man-box{display:flex;gap:8px;margin-top:8px;animation:fadeUp .25s ease both}
.man-box .inp{flex:1;min-width:0;direction:ltr;text-align:center;text-transform:uppercase;padding:12px}
.man-box:has(#manYear) button{flex-basis:100%;min-height:44px;padding:12px 18px}
.man-box button{border:0;border-radius:12px;padding:0 18px;background:var(--gold);color:#1b1300;font:inherit;font-weight:700}
.req{color:var(--red)}
.res-box{text-align:center;padding:22px 6px 6px}
.res-box .ico{width:84px;height:84px;border-radius:50%;margin:0 auto 14px;display:flex;align-items:center;justify-content:center;font-size:2.6rem;font-weight:700}
.res-box.ok .ico{background:var(--green)}
.res-box.bad .ico{background:var(--red)}
.res-box .row{text-align:right;justify-content:flex-start}
.err-box{background:rgba(226,85,85,.15);border:1px solid rgba(226,85,85,.6);border-radius:12px;padding:14px;margin-top:16px}

footer.credit{position:relative;z-index:1;text-align:center;color:var(--mut);font-size:.85rem;padding:10px 0 22px;letter-spacing:.02em}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);
  background:#0e2f55;border:1px solid var(--line);color:var(--txt);padding:12px 18px;border-radius:12px;opacity:0;transition:.25s;z-index:100;max-width:90vw;text-align:center;pointer-events:none}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#toast.err{border-color:var(--red);background:#3a1620}

/* ---------- animation ---------- */
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:none}}
@keyframes slideDown{from{transform:none}to{transform:translateY(100%)}}
@keyframes pop{0%{transform:scale(.3);opacity:0}60%{transform:scale(1.12);opacity:1}100%{transform:scale(1)}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes shake{0%,100%{transform:none}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
@keyframes flash{0%{box-shadow:0 0 0 0 rgba(31,157,88,.9)}100%{box-shadow:0 0 0 14px rgba(31,157,88,0)}}
@keyframes pulseLine{0%,100%{opacity:.35}50%{opacity:1}}
.wrap{animation:fadeUp .38s cubic-bezier(.2,.8,.2,1) both}
.actions .big-btn,.wide-btn,.stat{animation:fadeUp .45s cubic-bezier(.2,.8,.2,1) both}
.actions .big-btn:nth-child(1){animation-delay:.06s}.actions .big-btn:nth-child(2){animation-delay:.12s}
#bLog{animation-delay:.18s}#bAdm{animation-delay:.24s}.stat{animation-delay:.3s}
.big-btn,.wide-btn,.btn,.chipb,.tab,.mini,.ghost{transition:transform .15s ease,box-shadow .2s ease,background-color .2s ease,opacity .2s}
.big-btn{box-shadow:0 8px 22px rgba(0,0,0,.28)}

.big-btn:active{box-shadow:0 3px 10px rgba(0,0,0,.3)}
.pc,.lg,.emp,.res-h{animation:fadeUp .35s cubic-bezier(.2,.8,.2,1) both}
.pc:nth-child(2),.lg:nth-child(2){animation-delay:.04s}.pc:nth-child(3),.lg:nth-child(3){animation-delay:.08s}
.pc:nth-child(4),.lg:nth-child(4){animation-delay:.12s}.pc:nth-child(5),.lg:nth-child(5){animation-delay:.16s}
.pc:nth-child(n+6),.lg:nth-child(n+6){animation-delay:.2s}
.flow{animation:slideUp .34s cubic-bezier(.2,.8,.2,1) both}
.flow.closing{animation:slideDown .24s ease-in both}
.fb>*{animation:fadeUp .3s cubic-bezier(.2,.8,.2,1) both}
.reader{position:relative;transition:box-shadow .2s}
.reader.hit{animation:flash .5s ease-out}
.reader::after{content:"";position:absolute;left:8%;right:8%;top:50%;height:2px;background:var(--gold);box-shadow:0 0 12px var(--gold);animation:pulseLine 1.2s ease-in-out infinite;pointer-events:none;z-index:5}
.scanmsg.show{animation:shake .4s ease}
.res-box .ico{animation:pop .5s cubic-bezier(.2,.8,.2,1) both}
.res-box .ico svg{width:46px;height:46px}
.res-box .ico path{stroke-dasharray:40;stroke-dashoffset:40;animation:draw .4s .3s ease-out forwards}
.res-box h2{animation:fadeUp .4s .2s both}
.res-box .row{animation:fadeUp .4s .3s both}
.steps{transition:opacity .2s}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-delay:0s!important;transition-duration:.01ms!important}
  .res-box .ico path{stroke-dashoffset:0}}
.lists{margin-top:12px}
.list-btn{border:1.5px solid var(--line);background:var(--navy2);color:var(--txt);border-radius:16px;padding:16px 12px;display:flex;flex-direction:column;align-items:center;gap:4px;font-weight:700;font-size:1.05rem;animation:fadeUp .45s .22s cubic-bezier(.2,.8,.2,1) both;transition:transform .15s ease}

.list-btn.in{border-top:4px solid var(--green)}
.list-btn.out{border-top:4px solid var(--orange)}
.lb-n{font-size:1.6rem;line-height:1.1}
.list-btn.in .lb-n{color:#6fe0a0}.list-btn.out .lb-n{color:#ffb27a}
.xls-btn{margin-top:12px;border-color:#1f7a45;color:#8fe3b3}
.alert-big{position:absolute;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:#fff;text-align:center;padding:16px;border-radius:14px;background:rgba(205,30,30,.94);animation:redFlash .7s ease-in-out 4}
.alert-big .at{font-size:2rem;font-weight:700;line-height:1.2}
.alert-big .ad{font-size:1.05rem;opacity:.95}
.alert-big .ai{width:56px;height:56px;border-radius:50%;background:#fff;color:#c21e1e;font-size:2.2rem;font-weight:700;display:flex;align-items:center;justify-content:center;animation:pop .45s cubic-bezier(.2,.8,.2,1) both}
@keyframes redFlash{0%,100%{background:rgba(205,30,30,.94)}50%{background:rgba(255,70,70,1)}}
.flow.alarm .fh{border-bottom-color:var(--red)!important}
.flow.alarm{box-shadow:inset 0 0 0 6px var(--red)}
/* Independent scale keeps press feedback visible after entrance animations. */
button{transition:scale .16s cubic-bezier(.2,.8,.2,1),filter .16s ease,box-shadow .2s ease,background-color .2s ease,opacity .2s}
button:enabled:active{scale:.96;filter:brightness(1.12)}
@media(prefers-reduced-motion:reduce){button:enabled:active{scale:1;filter:brightness(1.12)}}
</style>

import { createEmployeeAuth, employeeAuthErrorMessage } from "./employee-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyD3BMLeDO6UpzBwYO4xWwCqoYZKKdSdfk4",
  authDomain: "new-store-project-8b00e.firebaseapp.com",
  projectId: "new-store-project-8b00e",
  storageBucket: "new-store-project-8b00e.firebasestorage.app",

};
const fbApp = initializeApp(firebaseConfig);
const db = getFirestore(fbApp);
const authFlow = createEmployeeAuth(fbApp, db);

// One delegated listener also covers buttons created by later screens and dialogs.
document.addEventListener('click', e => {
  const button = e.target.closest?.('button');
  if (!button || button.disabled || window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  button.getAnimations().filter(a => a.id === 'button-press').forEach(a => a.cancel());
  button.animate([{scale:'.96',filter:'brightness(1.12)'},{scale:'1.025',filter:'brightness(1.04)'},{scale:'1',filter:'brightness(1)'}],
    {id:'button-press',duration:240,easing:'cubic-bezier(.2,.8,.2,1)'});
}, true);
/* ---------- helpers ---------- */
const LS = 'dhl_store_session';
const $ = s => document.querySelector(s);
const on = (s, ev, fn) => { const el = $(s); if (el) el.addEventListener(ev, fn); };
const val = s => ($(s)?.value || '').trim();
const toEn = s => String(s ?? '')
  .replace(/[٠-٩]/g, d => '٠١٢٣٤٥٦٧٨٩'.indexOf(d))
  .replace(/[۰-۹]/g, d => '۰۱۲۳۴۵۶۷۸۹'.indexOf(d));
const digits = s => toEn(s).replace(/\D/g, '');

function errMsg(e) {
  const c = e?.code || '';
  if (c.includes('permission-denied')) return 'رفضت قاعدة البيانات العملية. يرجى التأكد من نشر قواعد Firestore.';
  if (c.includes('unavailable')) return 'لا يوجد اتصال بالإنترنت. يرجى المحاولة مرة أخرى.';
  if (c.startsWith('auth/') || c.startsWith('employee/')) return employeeAuthErrorMessage(e);
  return e?.message || String(e);
}
const fail = e => { console.error(e?.code || 'operation-failed'); toast(errMsg(e), 'err'); };

function shiftOf(d = new Date()) {
  const h = d.getHours();
  if (h >= 7 && h < 15) return 'شفت النهار';
  if (h >= 15 && h < 22) return 'شفت أول الليل';
  return 'شفت آخر الليل';
}
/* تاريخ الشفت: اليوم ما يتغير إلا الساعة 7 الصبح.
   أي حركة من 12 الليل لين 6:59 الصبح تنحسب على تاريخ اليوم اللي قبله */
function shiftDay(d = new Date()) {
  const x = new Date(d);
  if (x.getHours() < 7) x.setDate(x.getDate() - 1);
  return x;
}
const pad2 = n => String(n).padStart(2, '0');
const ymd = d => `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
function fmt(ts) {
  if (!ts) return '—';
  const d = ts.toDate ? ts.toDate() : new Date(ts);
  const s = shiftDay(d);
  const date = `${pad2(s.getDate())}/${pad2(s.getMonth() + 1)}/${s.getFullYear()}`;
  const time = `${pad2(d.getHours())}:${pad2(d.getMinutes())}`;
  return `<span dir="ltr">${date}</span>، ${shiftOf(d)}، الساعة <span dir="ltr">${time}</span>`;
}
function normAr(s) {
  return toEn(s).toLowerCase()
    .replace(/[أإآ]/g, 'ا').replace(/ة/g, 'ه').replace(/ى/g, 'ي')
    .replace(/[\u064B-\u0652\u0640]/g, '').replace(/\s+/g, ' ').trim();
}

/* وصل الأمانة: 0 + سنة(4) + منفذ(4) + رقم الوصل  مثال 020262201P56 */
function parseReceipt(raw) {
  const s = toEn(raw).toUpperCase().replace(/[^A-Z0-9]/g, '');
  const m = s.match(/^0*(20\d{2})(\d{4})([A-Z]+\d+)$/);
  if (!m) return null;
  return { raw: s, year: m[1], port: m[2], receipt: m[3], id: `${m[1]}_${m[3]}` };
}
function manualReceipt(year, receipt, ports) {
  const y = toEn(year).trim(), r = toEn(receipt).trim().toUpperCase();
  if (!/^20\d{2}$/.test(y) || !/^[A-Z]+\d+$/.test(r)) throw new Error('أدخل سنة من 4 أرقام ورقم وصل مثل P17');
  if (ports.length !== 1 || !/^\d{4}$/.test(ports[0])) throw new Error('يجب أن يحدد الأدمن كود منفذ واحد للقسم للإدخال اليدوي');
  return `0${y}${ports[0]}${r}`;
}
const parcelCount = p => { const n = p.parcelCount ?? p.after?.parcelCount ?? p.before?.parcelCount; return Number.isInteger(n) && n > 0 ? n : 1; };
/* باركود الرف: SH-A1 */
function parseShelf(raw) {
  const s = toEn(raw).toUpperCase().replace(/\s/g, '');
  const m = s.match(/^SH-?([A-Z])([1-9]\d*)$/);
  return m ? `${m[1]}${m[2]}` : null;
}

let actx;
function buzz(ok) {
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const o = actx.createOscillator(), g = actx.createGain();
    o.frequency.value = ok ? 1250 : 280; g.gain.value = 0.15;
    o.connect(g); g.connect(actx.destination); o.start(); o.stop(actx.currentTime + (ok ? 0.12 : 0.35));
  } catch {}
  try { navigator.vibrate && navigator.vibrate(ok ? 60 : [90, 60, 90]); } catch {}
}

/* ---------- الأقسام / المنافذ ----------
   كل موظف له قسم (section). الأدمن يدير قسمه بس.
   المسؤول العام (isSuper) يشوف كل الأقسام ويتنقل بينها.
   البيانات القديمة اللي ما فيها قسم تنحسب على DHL */
const DEFAULT_SECTIONS = [{ id: 'dhl', name: 'قسم جمارك DHL', ports: ['2201'] }];
const LS_VIEW = 'store_view_section';
let sections = [...DEFAULT_SECTIONS];
let curSec = 'dhl';
const secOf = x => (x && x.section) || 'dhl';
const secName = id => id === 'all' ? 'جميع الأقسام' : ((sections.find(x => x.id === id) || {}).name || id);
const inSec = x => curSec === 'all' || secOf(x) === curSec;
const isAll = () => curSec === 'all';
/* رقم وثيقة الطرد: DHL يبقى مثل ما هو عشان البيانات القديمة، والباقي يسبقه اسم القسم */
const pid = r => curSec === 'dhl' ? r.id : `${curSec}_${r.id}`;
/* أكواد المنافذ: كل قسم يقبل وصولات منفذه بس. القسم اللي ما له كود يقبل الكل */
const secPorts = id => ((sections.find(x => x.id === id) || {}).ports || []);
const parsePorts = str => [...new Set((toEn(str || '').match(/\d{4}/g) || []))];
function portErr(r) {
  const ports = secPorts(curSec);
  if (ports.includes(r.port)) return null;
  if (!ports.length) return 'لم يتم ضبط أكواد هذا المنفذ. يرجى مراجعة الأدمن';
  const owner = sections.find(x => (x.ports || []).includes(r.port));
  const nm = secName(curSec), toSec = /^قسم/.test(nm) ? `ل${nm}` : `لقسم ${nm}`;
  return `هذا الوصل تابع لمنفذ ${r.port}${owner ? ` (${owner.name})` : ''}، وليس ${toSec}`;
}
const secTag = x => isAll() ? `<span class="sec-tag">${esc(secName(secOf(x)))}</span>` : '';

async function loadSections() {
  const epoch = sessionEpoch;
  try {
    const s = await getDocs(collection(db, 'sections'));
    if (epoch !== sessionEpoch) return;
    const list = s.docs.map(d => ({ id: d.id, ...d.data() }));
    const merged = list.map(x => { const d = DEFAULT_SECTIONS.find(y => y.id === x.id); return d ? { ...d, ...x, ports: Array.isArray(x.ports) ? x.ports : d.ports } : x; });
    sections = [...DEFAULT_SECTIONS.filter(d => !list.some(x => x.id === d.id)), ...merged]
      .sort((a, b) => (a.id === 'dhl' ? -1 : b.id === 'dhl' ? 1 : (a.name || '').localeCompare(b.name || '', 'ar')));
  } catch (e) { if (epoch !== sessionEpoch) return; console.warn('sections', e); sections = [...DEFAULT_SECTIONS]; }
}
function applySection() {
  curSec = me.isSuper ? (localStorage.getItem(LS_VIEW) || 'all') : secOf(me);
  if (curSec !== 'all' && !sections.some(x => x.id === curSec)) curSec = me.isSuper ? 'all' : curSec;
  parcels = allParcels.filter(inSec);
}
function setSection(id) {
  curSec = id;
  localStorage.setItem(LS_VIEW, id);
  parcels = allParcels.filter(inSec);
}

const logFields = () => ({ empNo: me.no, empName: me.name, section: curSec, shift: shiftOf(), shiftDate: ymd(shiftDay()), sessionId, actorUid: me.uid, at: serverTimestamp() });
const userFrom = (no, d) => ({ no, name: d.name, isAdmin: !!d.isAdmin || !!d.isSuper, isSuper: !!d.isSuper, section: secOf(d) });

function clearSessionView() {
  sessionEpoch++;
  for (const cancel of [...activeFlowClosers]) { void cancel(true); }
  localStorage.removeItem(LS); // Discard the previous number-only session format.
  if (unsubParcels) { unsubParcels(); unsubParcels = null; }
  me = null; sessionId = null; parcels = []; allParcels = []; currentIdentityKey = null;
  employees = []; allEmployees = [];
}
const authViewKey = identity => JSON.stringify([identity.uid, identity.generation, identity.isOwnerAdmin, identity.profile?.name, identity.profile?.section, !!identity.profile?.isAdmin, !!identity.profile?.isSuper]);
async function acceptIdentity(identity, recordLogin = false) {
  const epoch = sessionEpoch;
  const profile = identity.profile || {};
  me = { ...userFrom(identity.employeeId, profile), uid: identity.uid,
    isAdmin: identity.isOwnerAdmin || !!profile.isAdmin || !!profile.isSuper,
    isSuper: identity.isOwnerAdmin || !!profile.isSuper };
  currentIdentityKey = authViewKey(identity);
  sessionId = sessionId || uid();
  await loadSections();
  if (epoch !== sessionEpoch || me?.uid !== identity.uid) return;
  applySection();
  if (recordLogin) await setDoc(doc(collection(db, 'logs')), {
    type: 'login', ...logFields(), section: me.isSuper ? 'all' : secOf(me)
  });
  if (epoch !== sessionEpoch || me?.uid !== identity.uid) return;
  renderHome();
}
async function doLogin(no, password, firstPassword) {
  signingIn = true;
  try {
    const identity = firstPassword
      ? await authFlow.enroll(no, password)
      : await authFlow.login(no, password);
    clearSessionView();
    await acceptIdentity(identity, true);
  } finally { signingIn = false; }
}
async function logout() {
  clearSessionView(); renderLogin();
  try { await authFlow.logout(); } catch (e) { fail(e); }
}

function startParcels() {
  if (unsubParcels || !me) return;
  const epoch = sessionEpoch;
  const parcelQuery = me.isSuper ? collection(db, 'parcels') : query(collection(db, 'parcels'), where('section', '==', secOf(me)));
  unsubParcels = onSnapshot(parcelQuery, snap => {
    if (epoch !== sessionEpoch || !me) return;
    allParcels = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    parcels = allParcels.filter(inSec);
    const ci = $('#cntIn'); if (ci) ci.textContent = parcels.filter(p => p.status === 'in').length;
    const co = $('#cntOut'); if (co) co.textContent = parcels.filter(p => p.status === 'out').length;
    const q = $('#q'); if (q && q.value.trim()) runSearch(q.value);
    if (typeof drawList === 'function' && $('#plist')) drawList();
  }, fail);
}

function runSearch(raw) {
  const res = $('#res'); if (!res) return;
  const q = normAr(raw);
  if (!q) { res.innerHTML = ''; return; }
  const list = parcels.filter(p => p.status !== 'deleted').filter(p => normAr(p.receipt).includes(q) || normAr(p.contents).includes(q))
    .sort((a, b) => (a.status === b.status ? (b.year || '').localeCompare(a.year || '') : a.status === 'in' ? -1 : 1));
  res.innerHTML = list.length
    ? `<div class="res-h">${list.length} نتيجة</div>` + list.slice(0, 60).map(parcelCard).join('')
    : `<div class="res-h">لا يوجد طرد بهذا الرقم أو المحتوى</div>`;
}

    <div class="grid2 export-filters"><div><label for="xFrom">من تاريخ</label><input id="xFrom" type="date" class="inp"></div><div><label for="xTo">إلى تاريخ</label><input id="xTo" type="date" class="inp"></div></div>
    <p class="mut sm">الفترة حسب يوم الوردية لتاريخ حجز الطرد. السجل الشامل يجمع المحجوزات والمسلمات بنفس تنسيق الجرد السابق.</p>
    ${['in','out','all'].map((k,i) => `<button class="btn line" data-export="${k}">${['المحجوزات','المسلمات','السجل الشامل'][i]}</button>`).join('')}</div>`);

function receiptKey(p) {

}

async function exportExcel(from, to, kind = 'all') {
  const epoch = sessionEpoch;

  if (!['in','out','all'].includes(kind)) return;
  const isCurrent = currentView(), section = curSec;
  if (typeof XLSX === 'undefined') return toast('تعذّر تحميل مكتبة Excel، يرجى التأكد من الاتصال بالإنترنت', 'err');
  if (!from || !to) return toast('يرجى اختيار التاريخين', 'err');
  if (from > to) [from, to] = [to, from];
  const ms = t => (t?.toMillis ? t.toMillis() : 0);
  let snapshot;
  try { snapshot = await getDocsFromServer(query(collection(db, 'parcels'), ...(me.isSuper && section === 'all' ? [] : [where('section', '==', section)]))); }
  catch (e) { if (isCurrent()) fail(e); return; }
  if (!isCurrent()) return;
  const list = snapshot.docs.map(d => ({ id: d.id, ...d.data() }))
    .filter(p => ['in','out'].includes(p.status) && (kind === 'all' || p.status === kind))
    .filter(p => { if (!p.addedAt) return false; const d = ymd(shiftDay(p.addedAt.toDate())); return d >= from && d <= to; })
    .sort((a, b) => bySequence(a, b) || ms(a.addedAt) - ms(b.addedAt));
  if (!list.length) return toast('لا توجد طرود خلال هذه الفترة', 'err');

  const headers = ['م', 'التاريخ', 'رقم الوصل', 'السنة', 'المحتويات', 'حجزه', 'التسليم', 'المستلم', 'الكتاب / الإشعار', 'سلّمه', 'تاريخ التسليم'];
  const rows = list.map((p, i) => {
    const out = p.status === 'out';
    const [d1] = parts(p.addedAt);
    const [d2, , t2] = parts(p.deliveredAt);
    return [i + 1, d1, p.receipt || '', +p.year || p.year || '', p.contents, p.addedByName,
      out ? 'مسلّم' : 'محجوز',
      out ? p.deliveredTo : '', out ? p.deliveryRef : '', out ? p.deliveredByName : '', out ? `${d2}  ${t2}` : ''];
  });
  const ws = XLSX.utils.aoa_to_sheet([headers, ...rows]);
  ws['!cols'] = [5, 12, 12, 8, 36, 20, 10, 22, 20, 20, 18].map(w => ({ wch: w }));
  ws['!views'] = [{ RTL: true }];
  ws['!autofilter'] = { ref: XLSX.utils.encode_range({ s: { r: 0, c: 0 }, e: { r: rows.length, c: headers.length - 1 } }) };
  ws['!rows'] = [{ hpt: 26 }, ...rows.map(() => ({ hpt: 22 }))];

  const border = { top: { style: 'thin', color: { rgb: 'BFC7D1' } }, bottom: { style: 'thin', color: { rgb: 'BFC7D1' } },
                   left: { style: 'thin', color: { rgb: 'BFC7D1' } }, right: { style: 'thin', color: { rgb: 'BFC7D1' } } };
  const base = { alignment: { horizontal: 'center', vertical: 'center', wrapText: true, readingOrder: 2 }, border, font: { name: 'Arial', sz: 11 } };
  const head = { ...base, font: { name: 'Arial', sz: 12, bold: true, color: { rgb: 'FFFFFF' } }, fill: { fgColor: { rgb: '052447' } } };
  const red  = { ...base, font: { name: 'Arial', sz: 11, bold: true, color: { rgb: '9C0006' } }, fill: { fgColor: { rgb: 'FFC7CE' } } };
  const redL = { ...base, fill: { fgColor: { rgb: 'FDE4E7' } } };
  const green = { ...base, font: { name: 'Arial', sz: 11, bold: true, color: { rgb: '1E6B3A' } }, fill: { fgColor: { rgb: 'D5F2DF' } } };
  headers.forEach((_, c) => { ws[XLSX.utils.encode_cell({ r: 0, c })].s = head; });
  rows.forEach((row, r) => {
    const out = row[6] === 'مسلّم';
    row.forEach((_, c) => {
      const ref = XLSX.utils.encode_cell({ r: r + 1, c });
      if (!ws[ref]) ws[ref] = { t: 's', v: '' };
      ws[ref].s = c === 6 ? (out ? red : green) : (c > 6 && out ? redL : base);
    });
  });

  const wb = XLSX.utils.book_new();
  wb.Workbook = { Views: [{ RTL: true }] };
  XLSX.utils.book_append_sheet(wb, ws, 'الجرد');

  const f = s => s.split('-').reverse().join('-');
  const name = `جرد-${kind}-${secName(section).replace(/\s+/g, '-')}-من-${f(from)}-إلى-${f(to)}.xlsx`;
  const data = XLSX.write(wb, { bookType: 'xlsx', type: 'array' });
  const blob = new Blob([data], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
  const file = new File([blob], name, { type: blob.type });
  try {
    if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: 'جرد المستودع' }); return; }
  } catch (e) { if (e?.name === 'AbortError') return; }
  if (epoch !== sessionEpoch || !me) return;
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
  toast(`تم تجهيز الجرد: ${rows.length} طرد`);
}

/* ---------- قراءة محسّنة للباركود الضعيف: تباين أعلى + بحث أدق ---------- */
let zxReader = null;
function zx() {
  if (zxReader || typeof ZXing === 'undefined') return zxReader;

    hints.set(ZXing.DecodeHintType.POSSIBLE_FORMATS, [ZXing.BarcodeFormat.CODE_39, ZXing.BarcodeFormat.CODE_128]);
    hints.set(ZXing.DecodeHintType.TRY_HARDER, true);

  } catch { zxReader = null; }

}
function enhancedLoop(sc, onText, paused) {
  const reader = zx(); if (!reader) return;
  const cv = document.createElement('canvas'), cx = cv.getContext('2d', { willReadFrequently: true });
  let turn = 0;
  const tick = () => {
    try { if (sc.getState?.() === 1) return; } catch { return; } /* الكاميرا وقفت */
    const v = document.querySelector('#reader video');
    if (!v || !v.isConnected) return;
    if (paused() || !v.videoWidth) return void setTimeout(tick, 250);
    try {
      /* نقص الشريط الأوسط (مكان الإطار) ونصغره لحجم مناسب */
      const vw = v.videoWidth, vh = v.videoHeight;
      const sh = Math.floor(vh * 0.38), sy = Math.floor((vh - sh) * [0.35, 0.5, 0.65][turn % 3]);
      const scale = Math.min(1, 1280 / vw);
      cv.width = Math.floor(vw * scale); cv.height = Math.floor(sh * scale);
      cx.drawImage(v, 0, sy, vw, sh, 0, 0, cv.width, cv.height);
      const img = cx.getImageData(0, 0, cv.width, cv.height), d = img.data, n = d.length / 4;
      /* تدرج رمادي + مد التباين (من أغمق 2% إلى أفتح 2%) */
      const g = new Uint8ClampedArray(n), hist = new Uint32Array(256);
      for (let i = 0, j = 0; i < n; i++, j += 4) { const y = (d[j] * 77 + d[j + 1] * 150 + d[j + 2] * 29) >> 8; g[i] = y; hist[y]++; }

      for (; lo < 255; lo++) { acc += hist[lo]; if (acc > cut) break; }
      acc = 0; for (; hi > 0; hi--) { acc += hist[hi]; if (acc > cut) break; }

      for (let i = 0, j = 0; i < n; i++, j += 4) {

    setTimeout(tick, 220);
  };

}

/* ---------- flow engine (كمّل كل الخطوات أو X يلغي) ---------- */

  const ov = document.createElement('div');
  ov.className = 'flow ' + kind;
  ov.innerHTML = `<div class="fh"><button class="x" aria-label="إلغاء العملية">✕</button><div class="ft">${esc(title)}</div><div class="steps"></div></div><div class="fb"></div>`;
  document.body.appendChild(ov); document.body.classList.add('noscroll');
  const body = ov.querySelector('.fb');

  async function stopScan() {
    if (!scanner) return;
    const s = scanner; scanner = null;
    if (scannerStart) { try { await scannerStart; } catch {} }
    try { await s.stop(); } catch {}
    try { s.clear(); } catch {}
    torchOn = false;
  }
  const isCurrent = () => !cancelled && epoch === sessionEpoch && !!actorUid && me?.uid === actorUid;

    if (cancelled && !ov.isConnected) return;

    if (immediate) ov.remove();
    await stopScan();
    if (!immediate) {
      ov.classList.add('closing');
      await new Promise(r => setTimeout(r, window.matchMedia('(prefers-reduced-motion: reduce)').matches ? 0 : 230));

    }

  ov.querySelector('.x').onclick = () => { const wasDone = finished; close(); if (!wasDone) toast('تم إلغاء العملية دون حفظ أي بيانات'); };

  return {
    close, isCurrent,
    step(i, n) { if (!isCurrent()) return; ov.querySelector('.steps').textContent = `${i} من ${n}`; },
    scan(prompt, validate, receiptMode = false) {
      return new Promise(async resolve => {
        if (!isCurrent()) return resolve(null);
        pending = resolve;
        body.innerHTML = (rcTag ? `<div class="rc-tag"><span>الوصل</span><b>${esc(rcTag)}</b></div>` : '') +
          `<p class="prompt">${esc(prompt)}</p><div id="reader" class="reader"></div><button type="button" class="flash-btn" id="flashBtn">🔦 تشغيل الفلاش</button>
          <button type="button" class="man-btn" id="manBtn">⌨️ إدخال يدوي</button><div class="man-box" id="manBox" hidden style="flex-wrap:wrap">${receiptMode ? `<div class="grid2" style="width:100%"><div><label for="manYear">سنة الوصل</label><input id="manYear" class="inp" inputmode="numeric" maxlength="4" placeholder="2025"></div><div><label for="manInp">رقم الوصل</label>` : ''}<input id="manInp" class="inp" autocomplete="off" autocapitalize="characters" placeholder="${receiptMode ? 'P17' : 'رقم الرف مثل A1'}">${receiptMode ? `</div></div><p class="mut sm" style="width:100%;margin:0">كود المنفذ: <b dir="ltr">${esc(secPorts(curSec).join('، '))}</b></p>` : ''}<button type="button" id="manGo">تأكيد</button></div><div class="scanmsg"></div>
          <p class="mut sm center-t">ضع الباركود بالعرض، ميل الغلاف شوي لتخفيف الانعكاس وثبّت الجوال. جرّب إطفاء الفلاش إذا زاد اللمعان</p>`;

            verbose: false, experimentalFeatures: { useBarCodeDetectorIfSupported: true }

          const onText = async (text, manual) => {
            const now = Date.now();

    result(ok, msg, rows = []) {
      if (!isCurrent()) return;
      finished = true;
      body.innerHTML = `<div class="res-box ${ok ? 'ok' : 'bad'}"><div class="ico">${ok ? '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>' : '!'}</div><h2>${esc(msg)}</h2>
        ${rows.map(([k, v]) => `<div class="row"><span>${esc(k)}</span><b>${esc(v)}</b></div>`).join('')}</div>
        <button class="btn gold" id="fDone">${ok ? 'تم' : 'العودة إلى الرئيسية'}</button>`;
      body.querySelector('#fDone').onclick = () => close();
    }
  };
}

/* ---------- إدخال وصل أمانة ---------- */
async function flowAdd() {
  if (!me) return;
  if (isAll()) return toast('يرجى اختيار القسم أولاً', 'err');
  const f = openFlow('إدخال وصل أمانة', 'add');
  f.step(1, 3);
  const r = await f.scan('امسح باركود وصل الأمانة', async t => {
    const p = parseReceipt(t);
    if (!p) return { err: 'هذا ليس باركود وصل أمانة' };
    const pe = portErr(p); if (pe) return { alert: 'منفذ غير مطابق', err: pe };
    p.docId = pid(p);
    const s = await getDocFromServer(doc(db, 'parcels', p.docId));
    if (s.exists()) {
      const d = s.data();
      return d.status === 'in'
        ? { alert: 'الطرد مسجل', err: `الوصل ${p.receipt} / ${p.year} موجود على الرف ${d.shelf}` }
        : { alert: 'مسلّم بالفعل', err: `الوصل ${p.receipt} / ${p.year} سُلّم إلى ${d.deliveredTo}، ${plainWhen(d.deliveredAt)}` };
    }
    return { ok: p };
  }, true);
  if (!r || !f.isCurrent()) return;

  f.step(2, 3);
  const fields = [{ key: 'contents', label: 'المحتويات', multi: true }, { key: 'parcelCount', label: 'عدد الطرود', number: true }];
  const fm = await f.form(fields, `وصل ${esc(r.receipt)} / ${esc(r.year)}`);
  if (!fm || !f.isCurrent()) return;

  f.step(3, 3);
  const shelf = await f.scan('امسح باركود الرف', t => {
    const s = parseShelf(t);
    return s ? { ok: s } : { err: 'هذا ليس باركود رف' };
  });
  if (!shelf || !f.isCurrent()) return;

  f.busy('جاري الحفظ…');
  try {
    if (!f.isCurrent()) return;
    const lf = logFields();
    const b = writeBatch(db), operation = uid();
    b.set(doc(db, 'parcels', r.docId), {
      section: curSec, receipt: r.receipt, year: r.year, port: r.port, raw: r.raw,
      contents: fm.contents, parcelCount: +toEn(fm.parcelCount), shelf, status: 'in', operationId: operation,
      addedBy: me.no, addedByUid: me.uid, addedByName: me.name, addedShift: lf.shift, addedAt: serverTimestamp()
    });
    b.set(doc(db, 'logs', operation), { type: 'add', parcelId: r.docId, receipt: r.receipt, year: r.year, shelf, contents: fm.contents, parcelCount: +toEn(fm.parcelCount), ...lf });
    await b.commit();
    if (!f.isCurrent()) return;
    f.result(true, 'تم إضافة الطرد إلى المستودع', [['الوصل', `${r.receipt} / ${r.year}`], ['المحتويات', fm.contents], ['عدد الطرود', +toEn(fm.parcelCount)], ['الرف', shelf]]);
  } catch (e) {
    console.error(e);
    f.result(false, 'لم يتم حفظ الطرد', [['السبب', errMsg(e)]]);
  }
}

/* ---------- تسليم طرد ---------- */
async function flowDeliver() {
  if (!me) return;
  if (isAll()) return toast('يرجى اختيار القسم أولاً', 'err');
  const f = openFlow('تسليم طرد', 'del');
  f.step(1, 3);
  let p = null;
  const r = await f.scan('امسح باركود وصل الأمانة', async t => {
    const x = parseReceipt(t);
    if (!x) return { err: 'هذا ليس باركود وصل أمانة' };
    const pe = portErr(x); if (pe) return { alert: 'منفذ غير مطابق', err: pe };
    const s = await getDocFromServer(doc(db, 'parcels', pid(x)));
    if (!s.exists()) return { err: `الوصل ${x.receipt} / ${x.year} غير مسجل في مستودع ${secName(curSec)}` };
    const d = s.data();
    if (d.status !== 'in') return { alert: 'مسلّم بالفعل', err: `الوصل ${x.receipt} / ${x.year} سُلّم إلى ${d.deliveredTo}، ${plainWhen(d.deliveredAt)}` };
    p = { id: pid(x), ...d };
    return { ok: x };
  }, true);
  if (!r || !f.isCurrent()) return;

  f.step(2, 3);
  const shelf = await f.scan(`امسح باركود الرف ${p.shelf}`, t => {
    const s = parseShelf(t);
    if (!s) return { err: 'هذا ليس باركود رف' };
    if (s !== p.shelf) return { err: `الطرد مسجل على الرف ${p.shelf}، بينما تم مسح الرف ${s}` };
    return { ok: s };
  });
  if (!shelf || !f.isCurrent()) return;

  f.step(3, 3);
  const fields = [{ key: 'to', label: 'اسم المستلم' }, { key: 'ref', label: 'اسم الكتاب أو رقم إشعار التسليم' }];
  fields.submit = 'تأكيد التسليم';
  const fm = await f.form(fields, `وصل ${esc(p.receipt)} / ${esc(p.year)}، ${esc(p.contents)}`);
  if (!fm || !f.isCurrent()) return;

  f.busy('جاري الحفظ…');
  try {
    if (!f.isCurrent()) return;
    const lf = logFields();
    const operation = uid();
    await runTransaction(db, async b => {
    const fresh = await b.get(doc(db, 'parcels', p.id));
    if (!f.isCurrent() || fresh.data()?.status !== 'in' || fresh.data()?.shelf !== shelf) throw new Error('تغيّرت بيانات الطرد؛ أعد العملية');
    b.update(doc(db, 'parcels', p.id), {
      status: 'out', operationId: operation, deliveredTo: fm.to, deliveryRef: fm.ref,
      deliveredBy: me.no, deliveredByUid: me.uid, deliveredByName: me.name, deliveredShift: lf.shift, deliveredAt: serverTimestamp()
    });
    b.set(doc(db, 'logs', operation), { type: 'deliver', parcelId: p.id, receipt: p.receipt, year: p.year, shelf: p.shelf, contents: p.contents, parcelCount: parcelCount(p), deliveredTo: fm.to, deliveryRef: fm.ref, ...lf });
    });
    if (!f.isCurrent()) return;
    f.result(true, 'تم تسليم الطرد وإخراجه من المستودع', [['الوصل', `${p.receipt} / ${p.year}`], ['المستلم', fm.to], ['الكتاب / الإشعار', fm.ref]]);
  } catch (e) {
    console.error(e);
    f.result(false, 'لم يتم حفظ التسليم', [['السبب', errMsg(e)]]);
  }
}

/* Each action checks fresh state and saves an immutable before/after audit atomically. */
async function parcelAction(id, action) {
  if (!me || !['move','return','delete','restore'].includes(action) || (action !== 'move' && !me.isAdmin)) return;
  const p = parcels.find(x => x.id === id);
  if (!p || !inSec(p)) return;
  const f = openFlow(({move:'نقل الطرد',return:'إرجاع للمحجوزات',delete:'حذف طرد تجريبي',restore:'استرجاع الطرد'})[action], 'add');
  const section = p.section, actor = { ...me }, lf = { ...logFields(), section };
  let shelf = p.shelf;
  if (['move','return'].includes(action)) {
    shelf = await f.scan('امسح أو اكتب الرف الجديد', t => { const v = parseShelf(t); return v && v !== p.shelf ? {ok:v} : {err:'يرجى اختيار رف جديد صحيح'}; });
    if (!shelf || !f.isCurrent()) return;
  }
  const fields = [{key:'reason',label:'سبب العملية'}];
  if (action === 'delete') fields.push({key:'confirm',label:`لتأكيد أنه طرد تجريبي اكتب رقم الوصل ${p.receipt}`});
  fields.submit = 'تأكيد وحفظ العملية';
  const fm = await f.form(fields, `الوصل ${esc(p.receipt)} / ${esc(p.year)} · ${esc(secName(section))}`);
  if (!fm || !f.isCurrent()) return;
  if (fm.reason.length > 1000 || (action === 'delete' && toEn(fm.confirm).toUpperCase() !== p.receipt)) return f.result(false,'لم يتم الحفظ؛ تحقق من التأكيد والسبب');
  const operation = uid(), ref = doc(db, 'parcels', id);
  f.busy('جاري الحفظ…');
  try {
    await runTransaction(db, async tx => {
      const snap = await tx.get(ref), before = snap.data();
      if (!f.isCurrent() || !snap.exists() || before.status !== p.status || before.shelf !== p.shelf || before.operationId !== p.operationId) throw new Error('تغيّرت بيانات الطرد؛ أعد العملية');
      if ((action === 'move' && before.status !== 'in') || (action === 'return' && before.status !== 'out') || (action === 'delete' && !['in','out'].includes(before.status)) || (action === 'restore' && before.status !== 'deleted')) throw new Error('حالة الطرد لا تسمح بالعملية');
      const status = action === 'delete' ? 'deleted' : action === 'restore' ? before.deletedFromStatus : ['move','return'].includes(action) ? 'in' : before.status;
      const patch = {status, shelf, operationId:operation, changedAt:serverTimestamp(), changedByUid:actor.uid, changeReason:fm.reason};
      if (action === 'delete') Object.assign(patch, {deletedFromStatus:before.status, isTest:true});
      tx.update(ref, patch);
      tx.set(doc(db,'logs',operation), { ...lf, type:action, parcelId:id, receipt:before.receipt, year:before.year, contents:before.contents, shelf, fromShelf:before.shelf, reason:fm.reason, before, after:{...before,...patch} });
    });
    if (f.isCurrent()) f.result(true,'تم الحفظ مع سجل كامل', [['الوصل',p.receipt],['الرف',shelf],['السبب',fm.reason]]);
  } catch(e) { if (f.isCurrent()) f.result(false,'لم يتم الحفظ',[['السبب',errMsg(e)]]); }
}

function logCard(l) {
  if (l.type === 'login') {
    const cur = l.sessionId === sessionId;
    const label = l.idle ? (cur ? 'دخول (الجلسة الحالية)' : 'دخول بدون عمليات') : 'دخول';
    return `<div class="lg ${l.idle && !cur ? 'idle' : ''}"><div class="lg-h"><span class="tag ${l.idle && !cur ? 't-idle' : 't-login'}">${label}</span></div><div class="when">${fmt(l.at)}</div>
      <div class="meta">${esc(l.empName)}${secTag(l)}</div></div>`;
  }
  const add = l.type === 'add';
  const title = ({add:'إدخال',deliver:'تسليم',move:'نقل رف',return:'إرجاع للمحجوزات',delete:'حذف تجريبي',restore:'استرجاع'})[l.type] || l.type;
  return `<div class="lg"><div class="lg-h"><span class="tag ${add ? 't-add' : 't-del'}">${esc(title)}</span></div><div class="when">${fmt(l.at)}</div>
    <div class="rno">${esc(l.receipt)} <span class="yr">/ ${esc(l.year)}</span>${secTag(l)}</div>

    ${l.reason ? `<div class="row"><span>السبب</span><b>${esc(l.reason)}</b></div>` : ''}
    ${l.fromShelf ? `<div class="row"><span>الرف السابق</span><b>${esc(l.fromShelf)}</b></div>` : ''}
    ${l.type !== 'deliver' ? '' : `<div class="row"><span>المستلم</span><b>${esc(l.deliveredTo)}</b></div><div class="row"><span>الكتاب / الإشعار</span><b>${esc(l.deliveryRef)}</b></div>`}

}

async function loadEmployees() {
  if (!me?.isAdmin) return;
  const isCurrent = currentView(), container = $('#eList');
  const stillHere = () => isCurrent() && container && container === $('#eList');
  try {
    const scope = me.isSuper ? [] : [where('section', '==', secOf(me))];
    const [s, accessSnapshot] = await Promise.all([
      getDocsFromServer(query(collection(db, 'employees'), ...scope)),
      getDocsFromServer(query(collection(db, 'employeeAccess'), ...scope))
    ]);
    if (!stillHere()) return;
    const accessById = new Map(accessSnapshot.docs.map(d => [d.id, d.data()]));
    allEmployees = s.docs.map(d => ({ no: d.id, ...d.data(), accessActive: accessById.get(d.id)?.active === true, accessMissing: !accessById.has(d.id) }));
    /* أدمن القسم يشوف موظفين قسمه بس، والمسؤول العام ما يطلع عنده */
    employees = allEmployees
      .filter(e => (isAll() ? true : secOf(e) === curSec && (!e.isSuper || me.isSuper)))
      .sort((a, b) => (b.isSuper ? 1 : 0) - (a.isSuper ? 1 : 0) || (b.isAdmin ? 1 : 0) - (a.isAdmin ? 1 : 0) || (a.name || '').localeCompare(b.name || '', 'ar'));

    $('#eCnt').textContent = `(${employees.length})`;
    box.innerHTML = employees.map(e => `
      <div class="emp"><div class="who"><div class="nm">${esc(e.name)}${e.isSuper ? '<span class="adm">مسؤول عام</span>' : e.isAdmin ? '<span class="adm">أدمن</span>' : ''}${isAll() && !e.isSuper ? `<span class="sec-tag">${esc(secName(secOf(e)))}</span>` : ''}</div><div class="no">${esc(e.no)}${e.accessMissing ? ' · يحتاج تهيئة دخول' : !e.accessActive && !e.isSuper ? ' · موقوف' : ''}</div></div>
        ${e.isSuper ? '' : `<button class="mini" data-a="adm" data-no="${esc(e.no)}">${e.isAdmin ? 'إلغاء صلاحية الأدمن' : 'منح صلاحية أدمن'}</button>

async function addEmployee() {

  const isCurrent = currentView(), container = $('#eName');

}

let addingBulk = false;
async function addBulk() {
  if (addingBulk || !me?.isAdmin) return;
  const isCurrent = currentView(), container = $('#bulk'), button = $('#bulkGo');
  const stillHere = () => isCurrent() && container === $('#bulk');
  const actorNo = me.no;
  const lines = val('#bulk').split(/\n+/).map(l => l.trim()).filter(Boolean);
  const have = new Set(allEmployees.filter(e => e.accessActive).map(e => e.no));
  const sec = pickedSec('bSec');
  const rows = [];
  for (const l of lines) {
    const numMatch = l.match(/[0-9٠-٩]{4,}/);
    const no = digits(numMatch ? numMatch[0] : '');
    const name = (numMatch ? l.replace(numMatch[0], ' ') : l).replace(/[,،\t;|\-]+/g, ' ').replace(/\s+/g, ' ').trim();
    if (no && name && !have.has(no)) { rows.push({ no, name }); have.add(no); }
  }
  if (!rows.length) return toast('لم يتم العثور على موظفين جدد في القائمة (أو أن أرقامهم مسجلة في قسم آخر)', 'err');
  let completed = 0, skipped = 0;
  addingBulk = true; if ($('#bulkGo')) $('#bulkGo').disabled = true;
  try {
    for (const r of rows) {
      if (!stillHere()) return;
      const route = await authFlow.readRoute(r.no);
      if (!stillHere()) return;
      const profile = { name: r.name, isAdmin: false, section: sec, createdBy: actorNo };
      if (route?.enabled) { skipped++; continue; }
      if (route) await authFlow.readdEmployee(r.no, profile);
      else await authFlow.addEmployee(r.no, { ...profile, createdAt: serverTimestamp() });
      completed++;
    }
    if (!stillHere()) return;
    toast(`تمت إضافة ${completed} موظف${skipped ? `، وتجاوز ${skipped} مسجل مسبقاً` : ''}`);
    $('#bulk').value = '';
    await loadEmployees();
  } catch (e) {
    if (!stillHere()) return;
    toast(`تمت إضافة ${completed} موظف قبل التوقف. ${errMsg(e)}`, 'err');
    await loadEmployees();
  } finally { addingBulk = false; if (button?.isConnected) button.disabled = false; }
}

async function toggleAdmin(no) {
  if (!me?.isAdmin) return;
  const isCurrent = currentView();
  const e = employees.find(x => x.no === no); if (!e) return;
  if (e.isSuper) return;
  const admins = allEmployees.filter(x => x.accessActive && x.isAdmin && !x.isSuper && secOf(x) === secOf(e)).length;
  if (e.isAdmin && no === me.no) return toast('لا يمكنك إلغاء صلاحية الأدمن عن نفسك', 'err');
  if (e.isAdmin && admins <= 1 && !me.isSuper) return toast('يجب أن يبقى أدمن واحد على الأقل في القسم', 'err');
  try { await updateDoc(doc(db, 'employees', no), { isAdmin: !e.isAdmin }); if (isCurrent()) loadEmployees(); } catch (err) { if (isCurrent()) fail(err); }
}

const removingEmployees = new Set();
async function removeEmployee(no) {
  if (!me?.isAdmin || removingEmployees.has(no) || resettingEmployees.has(no)) return;
  const isCurrent = currentView();
  const e = employees.find(x => x.no === no);
  if (!e || e.isSuper || !e.accessActive) return;
  if (no === me.no) return toast('لا يمكنك حذف حسابك', 'err');
  if (!me.isSuper && secOf(e) !== secOf(me)) return;
  if (e.isAdmin && !me.isSuper && allEmployees.filter(x => x.accessActive && x.isAdmin && !x.isSuper && secOf(x) === secOf(e)).length <= 1)
    return toast('يجب أن يبقى أدمن واحد على الأقل في القسم', 'err');
  if (!confirm(`هل تريد حذف الموظف ${e.name}؟ سيتوقف دخوله للنظام وستبقى حركاته السابقة محفوظة. يمكنك إعادة إضافته لاحقاً.`)) return;
  removingEmployees.add(no);
  const buttons = Array.from(document.querySelectorAll('.mini')).filter(b => b.dataset.no === no);
  buttons.forEach(b => b.disabled = true);
  try {
    await authFlow.removeEmployee(no);
    if (!isCurrent()) return;
    toast('تم حذف الموظف وإيقاف دخوله للنظام');
    await loadEmployees();
  } catch (err) { if (isCurrent()) fail(err); }
  finally { removingEmployees.delete(no); buttons.forEach(b => { if (b.isConnected) b.disabled = false; }); }
}

const resettingEmployees = new Set();
async function resetEmployee(no) {
  if (!me?.isAdmin || resettingEmployees.has(no) || removingEmployees.has(no)) return;
  const isCurrent = currentView();
  const e = employees.find(x => x.no === no); if (!e || e.isSuper) return;
  if (no === me.no) return toast('لا يمكنك إعادة تعيين حسابك من هنا', 'err');
  if (!confirm(`إعادة تعيين دخول ${e.name}؟ سيختار كلمة مرور جديدة، وسيبقى الاسم والرقم والسجل محفوظين.`)) return;
  resettingEmployees.add(no);
  const button = document.querySelector(`[data-a="reset"][data-no="${no}"]`);
  if (button) button.disabled = true;
  try {
    await authFlow.resetEmployee(no);
    if (!isCurrent()) return;
    toast('تمت إعادة التعيين. يستطيع الموظف اختيار كلمة مرور جديدة عند الدخول.');
    await loadEmployees();
  } catch (err) {
    if (isCurrent()) {
      toast(`${errMsg(err)} إذا انقطعت العملية، اضغط إعادة تعيين مجدداً لإكمالها.`, 'err');
      await loadEmployees();
    }
  } finally { resettingEmployees.delete(no); if (button?.isConnected) button.disabled = false; }
}

async function moveEmployee(no) {
  if (!me?.isAdmin) return;
  const isCurrent = currentView();
  const e = allEmployees.find(x => x.no === no); if (!e || !me.isSuper) return;
  const opts = sections.map((x, i) => `${i + 1}- ${x.name}`).join('\n');
  const ans = prompt(`اختر القسم الذي سيُنقل إليه ${e.name}، واكتب رقمه:\n${opts}`);
  const i = parseInt(digits(ans || ''), 10) - 1;
  if (!(i >= 0 && i < sections.length)) return;
  try { const b = writeBatch(db); b.update(doc(db, 'employees', no), { section: sections[i].id }); b.update(doc(db, 'employeeAccess', no), { section: sections[i].id }); await b.commit(); if (!isCurrent()) return; toast(`تم النقل إلى ${sections[i].name}`); if (isCurrent()) loadEmployees(); } catch (err) { if (isCurrent()) fail(err); }
}

/* ---------- الأقسام (للمسؤول العام) ---------- */
async function tabSections() {
  viewEpoch++;
  if (!me?.isSuper) return;
  const isCurrent = currentView(), container = $('#tabBody');
  await loadSections();
  if (!isCurrent() || container !== $('#tabBody')) return;
  const counts = id => allParcels.filter(p => secOf(p) === id && p.status === 'in').length;
  $('#tabBody').innerHTML = `
    <div class="card"><h3>إضافة قسم / منفذ</h3>
      <p class="mut sm">مثال: قسم المسافرين، قسم الشحن الجوي، منفذ النويصيب. لكل قسم موظفوه ومحجوزاته وسجله الخاص.</p>
      <label for="sNm">اسم القسم</label><input id="sNm" class="inp" autocomplete="off">
      <label for="sPt">كود المنفذ (4 أرقام، وفي حال وجود أكثر من كود يُفصل بينها بمسافة)</label><input id="sPt" class="inp" inputmode="numeric" autocomplete="off" placeholder="مثال: 2203">
      <button id="sAdd" class="btn gold">إضافة القسم</button></div>
    <div class="card"><h3>الأقسام (${sections.length})</h3>
      ${sections.map(x => `<div class="sec-row"><div><b>${esc(x.name)}</b><div class="mut sm">كود المنفذ: <b dir="ltr">${(x.ports || []).length ? esc(x.ports.join('، ')) : 'يقبل جميع المنافذ'}</b> · محجوزات: ${counts(x.id)}</div></div>
        <button class="mini" data-id="${esc(x.id)}" data-a="nm">الاسم</button>
        <button class="mini" data-id="${esc(x.id)}" data-a="pt">الكود</button></div>`).join('')}</div>`;
  on('#sAdd', 'click', async () => {
    const name = val('#sNm');
    if (!name) return toast('يرجى إدخال اسم القسم', 'err');
    if (sections.some(x => normAr(x.name) === normAr(name))) return toast('هذا القسم موجود مسبقاً', 'err');
    const ports = parsePorts(val('#sPt'));
    const taken = ports.map(p => [p, sections.find(x => (x.ports || []).includes(p))]).find(([, o]) => o);
    if (taken) return toast(`الكود ${taken[0]} مسجل مسبقاً لـ ${taken[1].name}`, 'err');
    try {
      await setDoc(doc(db, 'sections', 's' + Date.now().toString(36)), { name, ports, createdAt: serverTimestamp(), createdBy: me.no });
      if (!stillHere()) return;
    toast(`تمت إضافة ${name}`); tabSections();
    } catch (e) { fail(e); }
  });
  document.querySelectorAll('.sec-row .mini').forEach(b => b.onclick = async () => {
    const x = sections.find(y => y.id === b.dataset.id); if (!x) return;
    if (b.dataset.a === 'pt') {
      const ans = prompt(`كود المنفذ لـ ${x.name}\n(4 أرقام، وفي حال وجود أكثر من كود يُفصل بينها بمسافة. اتركه فارغاً لقبول أي وصل)`, (x.ports || []).join(' '));
      if (ans === null) return;
      const ports = parsePorts(ans);
      const taken = ports.map(p => [p, sections.find(y => y.id !== x.id && (y.ports || []).includes(p))]).find(([, o]) => o);
      if (taken) return toast(`الكود ${taken[0]} مسجل مسبقاً لـ ${taken[1].name}`, 'err');
      try { await setDoc(doc(db, 'sections', x.id), { name: x.name, ports }, { merge: true }); toast('تم حفظ الكود'); tabSections(); } catch (e) { fail(e); }
      return;
    }
    const name = (prompt('الاسم الجديد', x.name) || '').trim();
    if (!name || name === x.name) return;
    try { await setDoc(doc(db, 'sections', x.id), { name, ports: x.ports || [] }, { merge: true }); toast('تم'); tabSections(); } catch (e) { fail(e); }
  });
}

function tabBarcode() {
  viewEpoch++;
  const letters = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('');
  $('#tabBody').innerHTML = `
    <div class="card"><h3>مولّد باركود الرفوف</h3>
      <p class="mut sm">اختر الرف لإنشاء صورة الباركود. اضغط على الصورة مطولاً واختر "حفظ في الصور"، أو استخدم زر المشاركة.</p>
      <div class="grid2">
        <div><label for="bL">الحرف</label><select id="bL" class="inp">${letters.map(l => `<option>${l}</option>`).join('')}</select></div>
        <div><label for="bN">الرقم</label><select id="bN" class="inp">${[1, 2, 3, 4].map(n => `<option>${n}</option>`).join('')}</select></div>
      </div>
      <button id="bGen" class="btn gold">إنشاء الباركود</button>
      <div id="bOut"></div></div>`;
  on('#bGen', 'click', () => {
    const code = `${$('#bL').value}${$('#bN').value}`;
    const bc = document.createElement('canvas');
    JsBarcode(bc, 'SH-' + code, { format: 'CODE128', displayValue: false, width: 4, height: 170, margin: 34, background: '#ffffff', lineColor: '#000000' });
    const out = document.createElement('canvas');
    out.width = bc.width; out.height = bc.height + 140;
    const ctx = out.getContext('2d');
    ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, out.width, out.height);
    ctx.drawImage(bc, 0, 0);
    ctx.fillStyle = '#000'; ctx.font = 'bold 110px Arial, sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(code, out.width / 2, bc.height + 55);
    const url = out.toDataURL('image/png');
    $('#bOut').innerHTML = `<img src="${url}" class="bcimg" alt="باركود الرف ${code}"><button id="bShare" class="btn line">مشاركة / حفظ صورة الرف ${code}</button>`;
    on('#bShare', 'click', () => out.toBlob(async blob => {
      const file = new File([blob], `shelf-${code}.png`, { type: 'image/png' });
      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        try { await navigator.share({ files: [file], title: `رف ${code}` }); } catch {}
      } else {
        const a = document.createElement('a'); a.href = url; a.download = `shelf-${code}.png`; a.click();
      }
    }, 'image/png'));
  });
}

/* ---------- boot ---------- */
localStorage.removeItem(LS);
renderBoot();
authFlow.watch(async identity => {
  if (signingIn) return;
  if (!identity) {
    // A repeated signed-out notification must not erase the password retry form.
    if (!me && $('#lNo')) return;
    clearSessionView(); renderLogin(); return;
  }
  const key = authViewKey(identity);
  if (key === currentIdentityKey) return;
  try { clearSessionView(); await acceptIdentity(identity, false); }
  catch (e) { clearSessionView(); renderLogin(); fail(e); }
}, error => {
  if (signingIn) return;
  clearSessionView(); renderLogin(); fail(error);
});
</script>
